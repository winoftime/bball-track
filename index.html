<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Hoops Tracker</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { background-color: #111827; color: white; touch-action: manipulation; }
        .digital-clock { font-family: 'Share Tech Mono', monospace; }
        /* Stops the annoying blue highlight when tapping buttons on mobile */
        button { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-between pb-8">

    <div class="w-full px-6 py-8 bg-gray-800 shadow-xl rounded-b-3xl">
        <div class="flex justify-between items-center mb-4">
            <div class="text-center">
                <p class="text-gray-400 text-sm font-bold tracking-widest uppercase">Home</p>
                <p class="text-5xl font-bold text-white">102</p>
            </div>
            <div class="text-center">
                <p class="text-gray-400 text-sm font-bold tracking-widest uppercase">Away</p>
                <p class="text-5xl font-bold text-white">98</p>
            </div>
        </div>
        
        <div class="flex flex-col items-center justify-center mt-6">
            <p class="text-xs text-gray-400 font-semibold mb-1 uppercase tracking-widest">Qtr 4</p>
            <div class="digital-clock text-6xl text-emerald-400 tracking-wider">
                04:23
            </div>
        </div>
    </div>

    <div class="w-full px-6 flex-grow flex flex-col justify-center">
        <div class="bg-gray-800 rounded-2xl p-4 flex items-center justify-between shadow-lg border border-gray-700">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-blue-600 flex items-center justify-center text-xl font-bold shadow-inner">
                    23
                </div>
                <div>
                    <h2 class="text-xl font-bold">LeBron J.</h2>
                    <p class="text-gray-400 text-sm">Pts: 28 | Reb: 7 | Ast: 8</p>
                </div>
            </div>
            <i data-lucide="chevron-down" class="text-gray-500"></i>
        </div>
    </div>

    <div class="w-full px-6 grid grid-cols-3 gap-4">
        <button class="bg-emerald-600 active:scale-95 transition-transform rounded-2xl p-4 flex flex-col items-center justify-center shadow-lg shadow-emerald-900/50" onclick="vibrate()">
            <span class="text-2xl font-bold">+2</span>
            <span class="text-xs font-semibold opacity-80 mt-1 uppercase">Points</span>
        </button>
        
        <button class="bg-emerald-500 active:scale-95 transition-transform rounded-2xl p-4 flex flex-col items-center justify-center shadow-lg shadow-emerald-900/50" onclick="vibrate()">
            <span class="text-2xl font-bold">+3</span>
            <span class="text-xs font-semibold opacity-80 mt-1 uppercase">Points</span>
        </button>
        
        <button class="bg-blue-600 active:scale-95 transition-transform rounded-2xl p-4 flex flex-col items-center justify-center shadow-lg shadow-blue-900/50" onclick="vibrate()">
            <i data-lucide="hand" class="mb-1"></i>
            <span class="text-xs font-bold opacity-80 uppercase">Rebound</span>
        </button>

        <button class="bg-purple-600 active:scale-95 transition-transform rounded-2xl p-4 flex flex-col items-center justify-center shadow-lg shadow-purple-900/50" onclick="vibrate()">
            <i data-lucide="users" class="mb-1"></i>
            <span class="text-xs font-bold opacity-80 uppercase">Assist</span>
        </button>

        <button class="bg-red-600 active:scale-95 transition-transform rounded-2xl p-4 flex flex-col items-center justify-center shadow-lg shadow-red-900/50" onclick="vibrate()">
            <i data-lucide="alert-octagon" class="mb-1"></i>
            <span class="text-xs font-bold opacity-80 uppercase">Foul</span>
        </button>

        <button class="bg-orange-600 active:scale-95 transition-transform rounded-2xl p-4 flex flex-col items-center justify-center shadow-lg shadow-orange-900/50" onclick="vibrate()">
            <i data-lucide="rotate-ccw" class="mb-1"></i>
            <span class="text-xs font-bold opacity-80 uppercase">Turnover</span>
        </button>
    </div>

    <script>
        lucide.createIcons();
        function vibrate() {
            // Makes the phone buzz slightly when tapped
            if (navigator.vibrate) { navigator.vibrate(50); }
        }
    </script>
</body>
</html>#
