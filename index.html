<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pro Hoops Tracker</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --accent: #6366f1; /* Indigo-500 */
            --success: #10b981; /* Emerald-500 */
            --danger: #ef4444; /* Red-500 */
            --zinc-950: #09090b;
            --zinc-900: #18181b;
            --zinc-800: #27272a;
        }

        body {
            background-color: var(--zinc-950);
            color: #fafafa;
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
            user-select: none;
            padding-bottom: env(safe-area-inset-bottom);
        }

        h1, h2, h3 {
            font-family: 'Outfit', sans-serif;
        }

        .digital-clock {
            font-family: 'Share Tech Mono', monospace;
        }

        button {
            -webkit-tap-highlight-color: transparent;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-dark {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        @keyframes slideDownIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .animate-in {
            animation: slideDownIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes breathe {
            0%, 100% { box-shadow: 0 0 0 0px rgba(99, 102, 241, 0); }
            50% { box-shadow: 0 0 15px 4px rgba(99, 102, 241, 0.4); }
        }

        .active-glow {
            animation: breathe 2s infinite ease-in-out;
            border-color: var(--accent) !important;
        }

        @keyframes pulse-clock {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(0.98); }
        }

        .clock-running {
            animation: pulse-clock 1s infinite ease-in-out;
        }
    </style>
</head>

<body class="h-[100dvh] flex flex-col relative overflow-hidden bg-zinc-950 text-zinc-100 selection:bg-indigo-500/30">

    <div id="toast-container"
        class="fixed top-4 left-0 right-0 z-[100] flex flex-col items-center pointer-events-none gap-2 px-4 transition-all">
    </div>

    <div id="view-menu" class="flex-grow flex flex-col p-6 w-full h-full overflow-y-auto animate-in">
        <div class="flex items-center justify-center py-12 flex-col">
            <div
                class="w-24 h-24 bg-gradient-to-br from-indigo-500 to-emerald-500 rounded-3xl rotate-12 flex items-center justify-center mb-6 shadow-2xl shadow-indigo-500/20">
                <i data-lucide="dribbble" class="text-white w-14 h-14 -rotate-12 animate-pulse"></i>
            </div>
            <h1 class="text-4xl font-extrabold tracking-tighter uppercase text-white mb-1">PRO HOOPS</h1>
            <div class="flex items-center gap-2">
                <span class="h-[1px] w-8 bg-emerald-500/50"></span>
                <p class="text-emerald-400 font-bold tracking-[0.3em] text-[10px] uppercase">FIBA Tracker</p>
                <span class="h-[1px] w-8 bg-emerald-500/50"></span>
            </div>
        </div>

        <button onclick="navToSetup()"
            class="w-full bg-indigo-600 hover:bg-indigo-500 py-5 rounded-2xl font-black text-xl active:scale-95 transition-all mb-8 shadow-xl shadow-indigo-950/50 flex items-center justify-center gap-3 border-t border-white/20">
            <i data-lucide="play-circle" class="fill-white/20"></i> START TRACKING
        </button>

        <div class="flex items-center justify-between mb-4">
            <h2 class="text-zinc-500 text-xs font-bold tracking-widest uppercase">Recent Games</h2>
            <div class="h-[1px] flex-grow ml-4 bg-zinc-800/50"></div>
        </div>
        <div id="history-list" class="flex-grow space-y-4 pb-12">
        </div>
    </div>

    <div id="view-setup" class="hidden flex-grow flex flex-col p-6 w-full h-full overflow-y-auto relative animate-in">
        <button onclick="navToMenu()" class="absolute top-6 left-6 w-10 h-10 glass rounded-full flex items-center justify-center text-zinc-400 hover:text-white active:scale-90 transition-all">
            <i data-lucide="chevron-left" class="w-6 h-6"></i>
        </button>
        <h2 class="text-3xl font-black mb-8 text-center mt-2 tracking-tight">GAME SETUP</h2>

        <div class="space-y-6 mb-8">
            <div class="flex gap-4">
                <div class="flex-1">
                    <label class="text-[10px] text-zinc-500 font-black uppercase tracking-[0.2em] px-1 mb-1 block">Your Team</label>
                    <input type="text" id="setup-home" placeholder="HOME"
                        class="w-full glass-dark text-white rounded-2xl p-4 border border-white/5 focus:outline-none focus:border-indigo-500/50 transition-colors font-bold uppercase tracking-wider">
                </div>
                <div class="flex-1">
                    <label class="text-[10px] text-zinc-500 font-black uppercase tracking-[0.2em] px-1 mb-1 block">Opponent</label>
                    <input type="text" id="setup-opponent" placeholder="AWAY"
                        class="w-full glass-dark text-white rounded-2xl p-4 border border-white/5 focus:outline-none focus:border-indigo-500/50 transition-colors font-bold uppercase tracking-wider">
                </div>
            </div>
            <div>
                <label class="text-[10px] text-zinc-500 font-black uppercase tracking-[0.2em] px-1 mb-1 block">Game Date</label>
                <input type="date" id="setup-date"
                    class="w-full glass-dark text-white rounded-2xl p-4 border border-white/5 focus:outline-none focus:border-indigo-500/50 transition-colors">
            </div>
        </div>

        <div class="flex justify-between items-center mb-4">
            <h3 class="text-sm font-bold tracking-tight text-zinc-300">STARTERS (SELECT 5)</h3>
            <button onclick="openModal('add-player-modal')"
                class="text-[10px] text-emerald-400 font-black border border-emerald-500/30 bg-emerald-500/10 px-4 py-2 rounded-full active:scale-95 transition-all hover:bg-emerald-500/20">
                + ADD PLAYER</button>
        </div>

        <div id="setup-roster-list" class="flex-grow space-y-3 mb-8 overflow-y-auto no-scrollbar">
        </div>

        <button onclick="startGame()"
            class="w-full bg-emerald-600 hover:bg-emerald-500 py-5 rounded-2xl font-black text-xl active:scale-95 transition-all shadow-xl shadow-emerald-950/50 shrink-0 mb-4 border-t border-white/20 uppercase tracking-widest">
            Tip Off
        </button>
    </div>

    <div id="view-game" class="hidden h-[100dvh] flex flex-col justify-between relative overflow-hidden bg-zinc-950">
        <!-- Modern Header -->
        <div class="w-full px-6 py-6 glass border-b border-white/5 shadow-2xl z-10">
            <div class="flex justify-between items-center mb-6">
                <button onclick="confirmExitGame()" class="w-10 h-10 glass rounded-full flex items-center justify-center text-zinc-400 active:scale-90 transition-all">
                    <i data-lucide="chevron-left" class="w-6 h-6"></i>
                </button>
                <div class="flex flex-col items-center justify-center cursor-pointer active:scale-95 group" onclick="advancePeriod()">
                    <p id="period-display"
                        class="text-[10px] text-emerald-400 font-black mb-1 uppercase tracking-[0.2em] px-4 py-1 bg-emerald-500/10 border border-emerald-500/20 rounded-full group-hover:bg-emerald-500/20 transition-all">
                        Qtr 1</p>
                </div>
                <div class="w-10"></div>
            </div>

            <div class="flex justify-between items-center gap-4">
                <!-- Home Team -->
                <div class="text-center flex-1 flex flex-col items-center">
                    <p id="home-name-display"
                        class="text-zinc-500 text-[10px] font-black tracking-[0.2em] uppercase truncate w-full mb-1">
                        Home</p>
                    <p id="home-score" class="text-6xl font-black text-white tabular-nums drop-shadow-[0_0_15px_rgba(255,255,255,0.1)]">0</p>
                </div>

                <!-- Clock -->
                <div class="flex flex-col items-center justify-center flex-1">
                    <div id="clock-display" onclick="toggleClock()"
                        class="digital-clock text-5xl text-emerald-400 tracking-tighter cursor-pointer active:scale-95 transition-all bg-zinc-900/50 px-6 py-3 rounded-2xl border border-white/5 shadow-inner">
                        10:00
                    </div>
                </div>

                <!-- Away Team -->
                <div class="text-center flex-1 flex flex-col items-center justify-center relative">
                    <p id="away-name-display"
                        class="text-zinc-500 text-[10px] font-black tracking-[0.2em] uppercase truncate w-full mb-1">
                        Away</p>
                    <p id="away-score" class="text-6xl font-black text-zinc-400 tabular-nums">0</p>
                    <div class="flex gap-1 absolute -bottom-8 left-1/2 -translate-x-1/2">
                        <button onclick="changeAwayScore(-1)"
                            class="w-7 h-7 glass rounded-full flex items-center justify-center text-xs font-black active:scale-90 transition-all hover:bg-white/5">-</button>
                        <button onclick="changeAwayScore(1)"
                            class="w-7 h-7 glass rounded-full flex items-center justify-center text-xs font-black active:scale-90 transition-all hover:bg-white/5">+</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="w-full px-4 mt-6 shrink-0">
            <p class="text-xs text-gray-400 font-semibold mb-0 uppercase tracking-widest px-2">On Court</p>
            <div id="active-players-container" class="flex gap-4 overflow-x-auto no-scrollbar pt-3 pb-3 px-2">
            </div>
        </div>

        <div class="w-full px-4 flex-grow content-center mt-4">
            <div class="stat-grid px-2">
                <button onclick="recordStat('ft_made')"
                    class="bg-emerald-600/90 hover:bg-emerald-500 py-6 rounded-3xl flex flex-col items-center justify-center shadow-lg shadow-emerald-900/20 border-t border-white/20 active:scale-95">
                    <span class="text-2xl font-black">+1</span>
                    <span class="text-[9px] font-black opacity-70 mt-1 uppercase tracking-widest">Free Throw</span>
                </button>
                <button onclick="recordStat('fg2_made')"
                    class="bg-indigo-600/90 hover:bg-indigo-500 py-6 rounded-3xl flex flex-col items-center justify-center shadow-lg shadow-indigo-900/20 border-t border-white/20 active:scale-95">
                    <span class="text-2xl font-black">+2</span>
                    <span class="text-[9px] font-black opacity-70 mt-1 uppercase tracking-widest">Points</span>
                </button>
                <button onclick="recordStat('fg3_made')"
                    class="bg-violet-600/90 hover:bg-violet-500 py-6 rounded-3xl flex flex-col items-center justify-center shadow-lg shadow-violet-900/20 border-t border-white/20 active:scale-95">
                    <span class="text-2xl font-black">+3</span>
                    <span class="text-[9px] font-black opacity-70 mt-1 uppercase tracking-widest">Points</span>
                </button>

                <button onclick="recordStat('ft_miss')"
                    class="glass text-red-400 border-red-500/20 py-5 rounded-3xl flex flex-col items-center justify-center active:scale-95">
                    <i data-lucide="x" class="w-5 h-5 mb-1 text-red-500/50"></i>
                    <span class="text-[9px] font-black uppercase tracking-widest">Miss FT</span>
                </button>
                <button onclick="recordStat('fg2_miss')"
                    class="glass text-red-400 border-red-500/20 py-5 rounded-3xl flex flex-col items-center justify-center active:scale-95">
                    <i data-lucide="x" class="w-5 h-5 mb-1 text-red-500/50"></i>
                    <span class="text-[9px] font-black uppercase tracking-widest">Miss 2P</span>
                </button>
                <button onclick="recordStat('fg3_miss')"
                    class="glass text-red-400 border-red-500/20 py-5 rounded-3xl flex flex-col items-center justify-center active:scale-95">
                    <i data-lucide="x" class="w-5 h-5 mb-1 text-red-500/50"></i>
                    <span class="text-[9px] font-black uppercase tracking-widest">Miss 3P</span>
                </button>

                <button onclick="recordStat('reb')"
                    class="glass border-white/5 py-5 rounded-3xl flex flex-col items-center justify-center active:scale-95 hover:bg-white/5">
                    <i data-lucide="hand" class="mb-1 w-5 h-5 text-indigo-400"></i>
                    <span class="text-[9px] font-black uppercase tracking-widest">Rebound</span>
                </button>
                <button onclick="recordStat('ast')"
                    class="glass border-white/5 py-5 rounded-3xl flex flex-col items-center justify-center active:scale-95 hover:bg-white/5">
                    <i data-lucide="share-2" class="mb-1 w-5 h-5 text-indigo-400"></i>
                    <span class="text-[9px] font-black uppercase tracking-widest text-indigo-100">Assist</span>
                </button>
                <button onclick="recordStat('foul')"
                    class="glass border-orange-500/20 py-4 rounded-3xl flex flex-col items-center justify-center active:scale-95 hover:bg-orange-500/10">
                    <span class="text-lg font-black text-orange-400">F</span>
                    <span class="text-[9px] font-black uppercase tracking-widest text-orange-400/70">Foul</span>
                </button>
                <button onclick="recordStat('to')"
                    class="glass border-white/5 py-4 rounded-3xl flex flex-col items-center justify-center active:scale-95 hover:bg-white/5 col-start-2">
                    <i data-lucide="rotate-ccw" class="mb-1 w-5 h-5 text-zinc-500"></i>
                    <span class="text-[9px] font-black uppercase tracking-widest text-zinc-500">Turnover</span>
                </button>
            </div>
        </div>

        <div class="w-full px-4 shrink-0 mb-12 mt-2 pb-6">
            <div class="glass rounded-3xl p-3 flex justify-around shadow-2xl border-t border-white/5 mx-2">
                <button onclick="openSubsModal()"
                    class="flex flex-col items-center p-3 text-zinc-400 hover:text-white active:scale-90 transition-all">
                    <i data-lucide="refresh-cw" class="mb-1 w-6 h-6"></i>
                    <span class="text-[9px] uppercase font-black tracking-widest">Subs</span>
                </button>
                <button onclick="undoLastAction()"
                    class="flex flex-col items-center p-3 text-zinc-400 hover:text-white active:scale-90 transition-all">
                    <i data-lucide="undo-2" class="mb-1 w-6 h-6"></i>
                    <span class="text-[9px] uppercase font-black tracking-widest">Undo</span>
                </button>
                <button onclick="openBoxScoreModal()"
                    class="flex flex-col items-center p-3 text-zinc-400 hover:text-white active:scale-90 transition-all">
                    <i data-lucide="bar-chart-2" class="mb-1 w-6 h-6"></i>
                    <span class="text-[9px] uppercase font-black tracking-widest">Stats</span>
                </button>
                <button onclick="confirmEndGame()"
                    class="flex-grow flex flex-col items-center p-3 ml-2 bg-red-500/10 rounded-2xl text-red-400 hover:text-red-300 active:scale-95 transition-all border border-red-500/20">
                    <i data-lucide="check-circle" class="mb-1 w-6 h-6"></i>
                    <span class="text-[9px] uppercase font-black tracking-widest">Finish Game</span>
                </button>
            </div>
        </div>
    </div>

    <div id="confirm-modal"
        class="hidden fixed inset-0 bg-black/60 backdrop-blur-md z-[100] flex items-center justify-center p-6 transition-opacity">
        <div class="glass w-full max-w-sm rounded-[2.5rem] p-8 border border-white/10 text-center shadow-2xl animate-in">
            <div class="w-16 h-16 bg-white/5 rounded-2xl flex items-center justify-center mx-auto mb-6">
                <i data-lucide="help-circle" class="w-10 h-10 text-indigo-400"></i>
            </div>
            <h2 id="confirm-title" class="text-2xl font-black mb-2 tracking-tight">Are you sure?</h2>
            <p id="confirm-message" class="text-zinc-400 text-sm mb-8 leading-relaxed">This action cannot be undone.</p>
            <div class="flex gap-4">
                <button id="btn-confirm-cancel"
                    class="flex-1 glass py-4 rounded-2xl font-black text-xs uppercase tracking-widest active:scale-95 transition-all">Cancel</button>
                <button id="btn-confirm-action"
                    class="flex-1 bg-indigo-600 py-4 rounded-2xl font-black text-xs uppercase tracking-widest active:scale-95 transition-all shadow-lg shadow-indigo-950/50">Confirm</button>
            </div>
        </div>
    </div>

    <div id="add-player-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-md z-50 flex items-center justify-center p-6">
        <div class="glass w-full max-w-sm rounded-[2.5rem] p-8 border border-white/10 animate-in">
            <h2 id="player-modal-title" class="text-2xl font-black mb-6 tracking-tight">ADD PLAYER</h2>
            <input type="hidden" id="edit-player-id">
            <div class="space-y-4 mb-8">
                <div>
                    <label class="text-[10px] text-zinc-500 font-black uppercase tracking-[0.2em] px-1 mb-1 block">Full Name</label>
                    <input type="text" id="new-player-name" placeholder="John Doe"
                        class="w-full glass-dark text-white rounded-2xl p-4 border border-white/5 focus:outline-none focus:border-indigo-500/50 transition-colors font-bold">
                </div>
                <div>
                    <label class="text-[10px] text-zinc-500 font-black uppercase tracking-[0.2em] px-1 mb-1 block">Jersey #</label>
                    <input type="number" id="new-player-number" placeholder="23"
                        class="w-full glass-dark text-white rounded-2xl p-4 border border-white/5 focus:outline-none focus:border-indigo-500/50 transition-colors font-bold">
                </div>
            </div>

            <div class="flex justify-between items-center mb-6 hidden" id="delete-player-container">
                <button onclick="confirmDeletePlayer()"
                    class="text-red-400 text-[10px] font-black uppercase tracking-widest active:scale-95 flex items-center gap-2 bg-red-500/10 px-4 py-2 rounded-full border border-red-500/20"><i
                        data-lucide="trash-2" class="w-3 h-3"></i> Delete Player</button>
            </div>

            <div class="flex gap-4">
                <button onclick="closeModal('add-player-modal')"
                    class="flex-1 glass py-4 rounded-2xl font-black text-xs uppercase tracking-widest active:scale-95 transition-all">Cancel</button>
                <button onclick="savePlayer()"
                    class="flex-1 bg-emerald-600 py-4 rounded-2xl font-black text-xs uppercase tracking-widest active:scale-95 transition-all shadow-lg shadow-emerald-950/50 border-t border-white/20">Save</button>
            </div>
        </div>
    </div>

    <div id="subs-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-xl z-50 flex flex-col p-6 animate-in">
        <div class="flex justify-between items-center mb-8 mt-4">
            <h2 class="text-3xl font-black tracking-tight">MANAGE LINEUP</h2>
            <button onclick="closeModal('subs-modal')" class="w-12 h-12 glass rounded-full flex items-center justify-center text-zinc-400 active:scale-90 transition-all"><i
                    data-lucide="x"></i></button>
        </div>
        <p class="text-zinc-400 text-sm mb-6 font-bold flex items-center gap-2"><i data-lucide="info" class="w-4 h-4"></i> Select 5 players for the active rotation.</p>
        <div id="roster-list" class="flex-grow overflow-y-auto space-y-4 pb-12 no-scrollbar">
        </div>
    </div>

    <div id="box-score-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-3xl z-50 flex flex-col p-6 animate-in">
        <div class="flex justify-between items-center mb-8 mt-4">
            <h2 id="box-score-title" class="text-3xl font-black tracking-tight">BOX SCORE</h2>
            <button onclick="closeModal('box-score-modal')" class="w-12 h-12 glass rounded-full flex items-center justify-center text-zinc-400 active:scale-90 transition-all"><i
                    data-lucide="x"></i></button>
        </div>
        <div class="overflow-x-auto flex-grow glass-dark rounded-[2.5rem] border border-white/5 no-scrollbar relative shadow-2xl">
            <table class="w-full text-left text-sm whitespace-nowrap border-collapse">
                <thead class="bg-white/5 text-zinc-500 text-[10px] font-black uppercase tracking-[0.2em] sticky top-0 z-20">
                    <tr>
                        <th class="px-6 py-5 sticky left-0 bg-zinc-900/90 backdrop-blur-md z-10 border-r border-white/5">Player</th>
                        <th class="px-6 py-5 text-center">PTS</th>
                        <th class="px-6 py-5 text-center">FGM-A</th>
                        <th class="px-6 py-5 text-center">FTM-A</th>
                        <th class="px-6 py-5 text-center">3PM-A</th>
                        <th class="px-6 py-5 text-center">FG%</th>
                        <th class="px-6 py-5 text-center">REB</th>
                        <th class="px-6 py-5 text-center">AST</th>
                        <th class="px-6 py-5 text-center">FLS</th>
                        <th class="px-6 py-5 text-center">TO</th>
                        <th class="px-6 py-5 text-center">MIN</th>
                    </tr>
                </thead>
                <tbody id="box-score-body" class="divide-y divide-white/5">
                </tbody>
            </table>
        </div>
        <div class="flex gap-4 mt-6">
            <button onclick="exportCSV()"
                class="flex-1 bg-emerald-600/20 text-emerald-400 border border-emerald-500/20 py-5 rounded-[1.5rem] font-black uppercase text-[10px] tracking-[0.2em] active:scale-95 transition-all flex items-center justify-center gap-3">
                <i data-lucide="download" class="w-5 h-5"></i> DOWNLOAD CSV
            </button>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // --- GLOBAL STATE & STORAGE ---
        let appState = {
            masterRoster: [],
            history: [],
            activeGame: null
        };

        const SECONDS_PER_PERIOD = 600; // FIBA: 10 mins
        let timerInterval = null;
        let isClockRunning = false;
        let currentActivePlayerId = null;
        let viewingGameData = null;

        // --- UTILS ---
        function safeLucide() {
            lucide.createIcons();
        }

        function vibrate() {
            if (navigator.vibrate) navigator.vibrate(40);
        }

        // --- CUSTOM UI COMPONENTS ---
        function showToast(message, type = 'info') {
            vibrate();
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');

            let bgClass = 'glass border-white/10';
            let iconColor = 'text-indigo-400';
            let iconName = 'info';

            if (type === 'warning') {
                bgClass = 'bg-orange-500/20 border-orange-500/30';
                iconColor = 'text-orange-400';
                iconName = 'alert-triangle';
            } else if (type === 'error') {
                bgClass = 'bg-red-500/20 border-red-500/30';
                iconColor = 'text-red-400';
                iconName = 'alert-octagon';
            } else if (type === 'success') {
                bgClass = 'bg-emerald-500/20 border-emerald-500/30';
                iconColor = 'text-emerald-400';
                iconName = 'check-circle';
            }

            toast.className = `flex items-center gap-4 px-6 py-4 rounded-3xl shadow-2xl backdrop-blur-2xl border ${bgClass} animate-toast pointer-events-auto max-w-sm w-full`;
            toast.innerHTML = `
                <i data-lucide="${iconName}" class="w-6 h-6 ${iconColor}"></i>
                <p class="text-xs font-black uppercase tracking-widest flex-grow text-white/90">${message}</p>
                <button onclick="this.parentElement.remove()" class="text-white/20 hover:text-white p-1 transition-colors"><i data-lucide="x" class="w-4 h-4"></i></button>
            `;

            container.appendChild(toast);
            lucide.createIcons({ root: toast });

            setTimeout(() => {
                if (toast.parentElement) {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateY(-20px)';
                    setTimeout(() => toast.remove(), 400);
                }
            }, 4000);
        }

        function showConfirm(title, message, confirmText, confirmClass, onConfirm) {
            vibrate();
            const modal = document.getElementById('confirm-modal');
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-message').innerText = message;

            const actionBtn = document.getElementById('btn-confirm-action');
            actionBtn.innerText = confirmText;
            actionBtn.className = `flex-1 py-4 rounded-2xl font-black text-xs uppercase tracking-widest active:scale-95 transition-all shadow-lg ${confirmClass}`;

            const cancelBtn = document.getElementById('btn-confirm-cancel');

            const newActionBtn = actionBtn.cloneNode(true);
            actionBtn.parentNode.replaceChild(newActionBtn, actionBtn);

            const newCancelBtn = cancelBtn.cloneNode(true);
            cancelBtn.parentNode.replaceChild(newCancelBtn, cancelBtn);

            newActionBtn.addEventListener('click', () => {
                modal.classList.add('hidden');
                onConfirm();
            });

            newCancelBtn.addEventListener('click', () => {
                modal.classList.add('hidden');
            });

            modal.classList.remove('hidden');
        }

        // --- INIT & PERSISTENCE ---
        function loadState() {
            try {
                const saved = localStorage.getItem('proHoopsState');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    // Migration: Ensure actionHistory exists
                    if (parsed.activeGame && !parsed.activeGame.actionHistory) {
                        parsed.activeGame.actionHistory = [];
                    }
                    appState = parsed;
                }
            } catch (e) {
                console.error("Failed to load state:", e);
                showToast("Storage error. Some data may be lost.", "error");
            }
        }

        function saveState() {
            try {
                localStorage.setItem('proHoopsState', JSON.stringify(appState));
            } catch (e) {
                console.error("Failed to save state:", e);
                if (e.name === 'QuotaExceededError') {
                    showToast("Storage full! Please clear browser data.", "error");
                }
            }
        }

        function init() {
            loadState();
            document.getElementById('setup-date').valueAsDate = new Date();
            if (appState.activeGame) {
                renderGameScreen();
                showView('view-game');
            } else {
                renderMenu();
                showView('view-menu');
            }
        }

        // --- NAVIGATION ---
        function showView(viewId) {
            ['view-menu', 'view-setup', 'view-game'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');
        }

        function navToMenu() {
            renderMenu();
            showView('view-menu');
        }

        function navToSetup() {
            document.getElementById('setup-home').value = '';
            document.getElementById('setup-opponent').value = '';
            appState.masterRoster.forEach(p => p.selectedForGame = false);
            renderSetupRoster();
            showView('view-setup');
        }

        // --- MENU LOGIC ---
        function renderMenu() {
            const list = document.getElementById('history-list');
            list.innerHTML = '';

            if (appState.history.length === 0) {
                list.innerHTML = `
                    <div class="glass-dark rounded-3xl p-12 text-center border-dashed border-2 border-white/5 animate-in">
                        <i data-lucide="ghost" class="w-12 h-12 text-zinc-700 mx-auto mb-4"></i>
                        <p class="text-[10px] text-zinc-500 font-black uppercase tracking-widest leading-relaxed">No games recorded.<br>Start your first session below.</p>
                    </div>
                `;
                safeLucide();
                return;
            }

            const sortedHistory = [...appState.history].reverse();
            sortedHistory.forEach((game, idx) => {
                const isWin = game.homeScore > game.awayScore;
                const resultColor = isWin ? 'text-emerald-400' : 'text-red-400';
                const resultText = isWin ? 'WIN' : 'LOSS';

                const card = document.createElement('div');
                card.className = 'glass rounded-3xl p-5 flex justify-between items-center group cursor-pointer hover:bg-white/5 active:scale-95 transition-all animate-in border-t border-white/5';
                card.style.animationDelay = `${idx * 0.05}s`;
                card.onclick = () => openBoxScoreModal(game.id);

                card.innerHTML = `
                    <div class="flex-grow">
                        <p class="text-[10px] text-zinc-500 font-black tracking-widest mb-1 flex items-center gap-2">
                             <i data-lucide="calendar" class="w-3 h-3"></i> ${game.date || 'UNSET'}
                        </p>
                        <p class="font-black text-lg tracking-tight uppercase">${game.homeTeam} <span class="text-zinc-600 px-1">vs</span> ${game.opponent}</p>
                    </div>
                    <div class="text-right flex items-center gap-6">
                        <div class="flex flex-col items-end">
                            <span class="${resultColor} text-[10px] font-black tracking-widest">${resultText}</span>
                            <span class="text-2xl font-black tabular-nums">${game.homeScore}:${game.awayScore}</span>
                        </div>
                        <button onclick="event.stopPropagation(); deleteGame(${game.id})" class="p-3 text-white/5 hover:text-red-400 hover:bg-red-500/10 rounded-2xl transition-all">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                `;
                list.appendChild(card);
            });
            safeLucide();
        }

        function deleteGame(id) {
            showConfirm(
                "Delete Game",
                "Permanently remove this game from history? This cannot be undone.",
                "Delete Forever",
                "bg-red-600 shadow-red-900/40",
                () => {
                    appState.history = appState.history.filter(g => g.id !== id);
                    saveState();
                    renderMenu();
                    showToast("Game deleted from history.", "success");
                }
            );
        }

        // --- ROSTER/SETUP LOGIC ---
        function renderSetupRoster() {
            const list = document.getElementById('setup-roster-list');
            list.innerHTML = '';

            if (appState.masterRoster.length === 0) {
                list.innerHTML = `
                    <div class="glass-dark rounded-2xl p-8 text-center border-dashed border border-white/5">
                        <p class="text-[10px] text-zinc-500 font-bold uppercase tracking-widest">No players found</p>
                    </div>
                `;
                return;
            }

            appState.masterRoster.forEach(p => {
                const isSelected = p.selectedForGame;
                list.innerHTML += `
                    <div class="glass rounded-2xl p-4 flex items-center justify-between group transition-all ${isSelected ? 'border-indigo-500/30 bg-indigo-500/5' : 'border-white/5'}">
                        <div class="flex items-center gap-4 cursor-pointer flex-grow" onclick="toggleSetupSelection(${p.id})">
                            <div class="w-6 h-6 rounded-lg border-2 flex items-center justify-center transition-all ${isSelected ? 'bg-indigo-500 border-indigo-500' : 'border-zinc-700'}">
                                ${isSelected ? '<i data-lucide="check" class="w-4 h-4 text-white"></i>' : ''}
                            </div>
                            <div class="w-10 h-10 rounded-2xl bg-zinc-900 flex items-center justify-center font-black text-xs border border-white/5">
                                ${p.number}
                            </div>
                            <span class="font-bold tracking-tight uppercase">${p.name}</span>
                        </div>
                        <button onclick="editPlayer(${p.id})" class="p-3 text-zinc-600 hover:text-white transition-colors">
                            <i data-lucide="settings-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                `;
            });
            safeLucide();
        }

        function toggleSetupSelection(id) {
            const player = appState.masterRoster.find(p => p.id === id);
            const selectedCount = appState.masterRoster.filter(p => p.selectedForGame).length;

            if (!player.selectedForGame && selectedCount >= 5) {
                return showToast("You can only select 5 starting players.", "warning");
            }
            player.selectedForGame = !player.selectedForGame;
            renderSetupRoster();
            saveState();
        }

        function editPlayer(id) {
            const player = appState.masterRoster.find(p => p.id === id);
            document.getElementById('player-modal-title').innerText = "Edit Player";
            document.getElementById('edit-player-id').value = player.id;
            document.getElementById('new-player-name').value = player.name;
            document.getElementById('new-player-number').value = player.number;
            document.getElementById('delete-player-container').classList.remove('hidden');
            openModal('add-player-modal');
        }

        function savePlayer() {
            const nameInput = document.getElementById('new-player-name').value;
            const numberInput = document.getElementById('new-player-number').value;
            const editId = document.getElementById('edit-player-id').value;

            if (!nameInput || !numberInput) return showToast("Please enter a name and number.", "warning");

            if (editId) {
                const player = appState.masterRoster.find(p => p.id == editId);
                player.name = nameInput;
                player.number = numberInput;
            } else {
                appState.masterRoster.push({
                    id: Date.now(),
                    number: numberInput,
                    name: nameInput,
                    selectedForGame: false
                });
            }

            resetPlayerModal();
            closeModal('add-player-modal');
            renderSetupRoster();
            saveState();
        }

        function confirmDeletePlayer() {
            showConfirm(
                "Delete Player",
                "Are you sure you want to remove this player from your roster?",
                "Delete",
                "bg-red-600",
                () => {
                    const editId = document.getElementById('edit-player-id').value;
                    appState.masterRoster = appState.masterRoster.filter(p => p.id != editId);
                    resetPlayerModal();
                    closeModal('add-player-modal');
                    renderSetupRoster();
                    saveState();
                    showToast("Player deleted.", "info");
                }
            );
        }

        function resetPlayerModal() {
            document.getElementById('player-modal-title').innerText = "Add Player";
            document.getElementById('edit-player-id').value = '';
            document.getElementById('new-player-name').value = '';
            document.getElementById('new-player-number').value = '';
            document.getElementById('delete-player-container').classList.add('hidden');
        }

        // --- GAME LOGIC ---
        function startGame() {
            const homeTeam = document.getElementById('setup-home').value || "HOME";
            const opponent = document.getElementById('setup-opponent').value || "AWAY";
            const dateInput = document.getElementById('setup-date').value;
            const formattedDate = dateInput ? new Date(dateInput).toLocaleDateString() : new Date().toLocaleDateString();
            
            const selectedPlayers = appState.masterRoster.filter(p => p.selectedForGame);

            if (selectedPlayers.length === 0) {
                return showToast("Select at least 1 player to start.", "warning");
            }

            const gameRoster = appState.masterRoster.map(p => ({
                id: p.id,
                name: p.name,
                number: p.number,
                onCourt: p.selectedForGame,
                stats: { pts: 0, fgm: 0, fga: 0, fg3m: 0, fg3a: 0, ftm: 0, fta: 0, reb: 0, ast: 0, foul: 0, to: 0, secondsPlayed: 0 }
            }));

            appState.activeGame = {
                id: Date.now(),
                homeTeam: homeTeam,
                opponent: opponent,
                date: formattedDate,
                period: 1,
                timeRemaining: SECONDS_PER_PERIOD,
                homeScore: 0,
                awayScore: 0,
                roster: gameRoster,
                actionHistory: []
            };

            const starter = gameRoster.find(p => p.onCourt);
            currentActivePlayerId = starter ? starter.id : null;

            saveState();
            renderGameScreen();
            showView('view-game');
        }

        function renderGameScreen() {
            const game = appState.activeGame;
            if (!game) return;

            document.getElementById('home-name-display').innerText = game.homeTeam;
            document.getElementById('away-name-display').innerText = game.opponent;
            document.getElementById('home-score').innerText = game.homeScore;
            document.getElementById('away-score').innerText = game.awayScore;

            let pText = game.period <= 4 ? `QTR ${game.period}` : `OT ${game.period - 4}`;
            document.getElementById('period-display').innerText = pText;

            updateClockDisplay();
            renderActivePlayers();
        }

        // --- CLOCK & PERIOD LOGIC ---
        function updateClockDisplay() {
            const game = appState.activeGame;
            const minutes = Math.floor(game.timeRemaining / 60);
            const seconds = game.timeRemaining % 60;
            document.getElementById('clock-display').innerText =
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function toggleClock() {
            vibrate();
            const clockEl = document.getElementById('clock-display');

            if (isClockRunning) {
                clearInterval(timerInterval);
                isClockRunning = false;
                clockEl.classList.remove('text-red-400', 'clock-running');
                clockEl.classList.add('text-emerald-400');
            } else {
                isClockRunning = true;
                clockEl.classList.remove('text-emerald-400');
                clockEl.classList.add('text-red-400', 'clock-running');

                timerInterval = setInterval(() => {
                    const game = appState.activeGame;
                    if (game.timeRemaining > 0) {
                        game.timeRemaining--;
                        game.roster.forEach(p => {
                            if (p.onCourt) p.stats.secondsPlayed++;
                        });
                        updateClockDisplay();
                        if (game.timeRemaining % 10 === 0) saveState();
                    } else {
                        toggleClock(); // Buzzer
                        showToast("PERIOD ENDED!", "warning");
                    }
                }, 1000);
            }
        }

        function advancePeriod() {
            showConfirm(
                "Advance Period",
                "Start the next period? The game clock will reset.",
                "Next Period",
                "bg-emerald-600",
                () => {
                    if (isClockRunning) toggleClock();
                    appState.activeGame.period++;
                    appState.activeGame.timeRemaining = SECONDS_PER_PERIOD;
                    renderGameScreen();
                    saveState();
                }
            );
        }

        // --- OPPONENT SCORE ---
        function changeAwayScore(amount) {
            vibrate();
            appState.activeGame.awayScore = Math.max(0, appState.activeGame.awayScore + amount);
            document.getElementById('away-score').innerText = appState.activeGame.awayScore;
            saveState();
        }

        // --- ON-COURT LOGIC ---
        function renderActivePlayers() {
            const container = document.getElementById('active-players-container');
            container.innerHTML = '';

            const onCourtPlayers = appState.activeGame.roster.filter(p => p.onCourt);

            if (!onCourtPlayers.find(p => p.id === currentActivePlayerId) && onCourtPlayers.length > 0) {
                currentActivePlayerId = onCourtPlayers[0].id;
            }

            onCourtPlayers.forEach(player => {
                const isActive = player.id === currentActivePlayerId;
                let bgClass = isActive ? "bg-indigo-600 shadow-[0_0_20px_rgba(99,102,241,0.4)] border-white/20 active-glow" : "glass-dark border-white/5 opacity-60";

                if (player.stats.foul === 4) bgClass = isActive ? "bg-orange-600 active-glow" : "bg-orange-600/30 border-orange-500/30 opacity-80";
                else if (player.stats.foul >= 5) bgClass = isActive ? "bg-red-600 active-glow" : "bg-red-600/30 border-red-500/30 opacity-80";

                container.innerHTML += `
                    <div onclick="setActivePlayer(${player.id})" class="flex flex-col items-center cursor-pointer transition-all min-w-[80px]">
                        <div class="w-16 h-16 rounded-[1.25rem] border flex items-center justify-center text-2xl font-black shadow-lg ${bgClass} transition-all">
                            ${player.number}
                        </div>
                        <p class="text-[10px] mt-2 font-black uppercase tracking-widest truncate w-full text-center ${isActive ? 'text-white' : 'text-zinc-500'}">${player.name.split(' ')[0]}</p>
                        <p class="text-[9px] text-emerald-400 font-black mt-0.5 tracking-tighter">${player.stats.pts}PTS • ${player.stats.reb}REB</p>
                    </div>
                `;
            });

            if (onCourtPlayers.length === 0) {
                container.innerHTML = `
                    <div class="w-full py-4 text-center glass border-dashed bg-red-500/5 border-red-500/20 rounded-2xl mx-4">
                        <p class="text-[10px] text-red-400 font-black uppercase tracking-widest">No players on court! Sub in below.</p>
                    </div>
                `;
            }
        }

        function setActivePlayer(id) {
            vibrate();
            currentActivePlayerId = id;
            renderActivePlayers();
        }

        function openSubsModal() {
            const list = document.getElementById('roster-list');
            list.innerHTML = '';

            appState.activeGame.roster.forEach(player => {
                const btnClass = player.onCourt ? "bg-red-500/10 text-red-400 border-red-500/20" : "bg-emerald-500/10 text-emerald-400 border-emerald-500/20";
                const btnText = player.onCourt ? "SUB OUT" : "SUB IN";
                const rowClass = player.onCourt ? "border-indigo-500/20 bg-indigo-500/5 shadow-inner" : "border-white/5 bg-white/5";

                list.innerHTML += `
                    <div class="glass rounded-3xl p-5 flex items-center justify-between transition-all ${rowClass}">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-2xl bg-zinc-900 border border-white/5 flex items-center justify-center font-black text-sm">
                                ${player.number}
                            </div>
                            <div>
                                <h3 class="font-black text-lg tracking-tight uppercase">${player.name}</h3>
                                <p class="text-[10px] text-zinc-500 font-black tracking-widest">${player.stats.pts} PTS • ${player.stats.foul}/5 FLS</p>
                            </div>
                        </div>
                        <button onclick="toggleSub(${player.id})" class="px-6 py-2 border rounded-xl text-[10px] font-black uppercase tracking-widest active:scale-90 transition-all ${btnClass}">
                            ${btnText}
                        </button>
                    </div>
                `;
            });
            openModal('subs-modal');
            safeLucide();
        }

        function toggleSub(id) {
            const player = appState.activeGame.roster.find(p => p.id === id);
            const onCourtCount = appState.activeGame.roster.filter(p => p.onCourt).length;

            if (!player.onCourt && onCourtCount >= 5) {
                return showToast("MAXIMUM 5 PLAYERS ON COURT", "warning");
            }

            player.onCourt = !player.onCourt;
            openSubsModal();
            renderActivePlayers();
            saveState();
        }

        // --- STAT RECORDING & UNDO ---
        function recordStat(actionType) {
            const player = appState.activeGame.roster.find(p => p.id === currentActivePlayerId);
            if (!player) return showToast("SELECT A PLAYER ON COURT", "warning");

            vibrate();
            let statChanges = {};

            switch (actionType) {
                case 'ft_made': statChanges = { pts: 1, ftm: 1, fta: 1 }; break;
                case 'ft_miss': statChanges = { fta: 1 }; break;
                case 'fg2_made': statChanges = { pts: 2, fgm: 1, fga: 1 }; break;
                case 'fg2_miss': statChanges = { fga: 1 }; break;
                case 'fg3_made': statChanges = { pts: 3, fgm: 1, fga: 1, fg3m: 1, fg3a: 1 }; break;
                case 'fg3_miss': statChanges = { fga: 1, fg3a: 1 }; break;
                case 'reb': statChanges = { reb: 1 }; break;
                case 'ast': statChanges = { ast: 1 }; break;
                case 'foul': statChanges = { foul: 1 }; break;
                case 'to': statChanges = { to: 1 }; break;
            }

            for (const [key, val] of Object.entries(statChanges)) {
                player.stats[key] = (player.stats[key] || 0) + val;
            }

            appState.activeGame.actionHistory.push({
                playerId: player.id,
                changes: statChanges,
                timestamp: Date.now()
            });

            if (statChanges.pts) {
                appState.activeGame.homeScore += statChanges.pts;
                const scoreEl = document.getElementById('home-score');
                scoreEl.innerText = appState.activeGame.homeScore;
                scoreEl.classList.add('text-emerald-400', 'scale-110');
                setTimeout(() => scoreEl.classList.remove('text-emerald-400', 'scale-110'), 200);
            }

            if (statChanges.foul) {
                if (player.stats.foul >= 5) showToast(`🛑 FOULED OUT: ${player.name}`, "error");
                else if (player.stats.foul === 4) showToast(`⚠️ FOUL TROUBLE: ${player.name}`, "warning");
            }

            renderActivePlayers();
            saveState();
        }

        function undoLastAction() {
            const history = appState.activeGame.actionHistory;
            if (history.length === 0) return showToast("Nothing to undo!", "info");

            vibrate();
            const lastAction = history.pop();
            const player = appState.activeGame.roster.find(p => p.id === lastAction.playerId);

            if (player) {
                for (const [key, val] of Object.entries(lastAction.changes)) {
                    player.stats[key] -= val;
                }
                if (lastAction.changes.pts) {
                    appState.activeGame.homeScore -= lastAction.changes.pts;
                    document.getElementById('home-score').innerText = appState.activeGame.homeScore;
                }
            }

            renderActivePlayers();
            saveState();
            showToast("Action undone.", "success");
        }

        // --- GAME END & UTILS ---
        function confirmExitGame() {
            showConfirm(
                "Exit Game",
                "Exit to main menu? Your game will remain active in the background.",
                "Exit to Menu",
                "bg-gray-600",
                () => {
                    if (isClockRunning) toggleClock();
                    navToMenu();
                }
            );
        }

        function confirmEndGame() {
            showConfirm(
                "End Game",
                "Are you sure you want to END this game? It will be saved to your history forever.",
                "End Game",
                "bg-red-600",
                () => {
                    if (isClockRunning) toggleClock();
                    appState.history.push(appState.activeGame);
                    appState.activeGame = null;
                    saveState();
                    navToMenu();
                    showToast("Game saved to history.", "success");
                }
            );
        }

        function formatMinutes(totalSeconds) {
            const m = Math.floor(totalSeconds / 60);
            const s = totalSeconds % 60;
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function openBoxScoreModal(gameId = null) {
            if (gameId) {
                viewingGameData = appState.history.find(g => Number(g.id) === Number(gameId));
            } else {
                viewingGameData = appState.activeGame;
            }

            if (!viewingGameData) return showToast("GAME DATA NOT FOUND", "error");

            document.getElementById('box-score-title').innerText = `${viewingGameData.homeTeam} vs ${viewingGameData.opponent}`;

            const tbody = document.getElementById('box-score-body');
            tbody.innerHTML = '';

            viewingGameData.roster.forEach(player => {
                const s = player.stats;
                const fgPercent = s.fga > 0 ? Math.round((s.fgm / s.fga) * 100) : 0;
                const mins = formatMinutes(player.stats.secondsPlayed);
                
                const highlightRow = s.pts >= 20 || s.reb >= 10 || s.ast >= 10;

                tbody.innerHTML += `
                    <tr class="${highlightRow ? 'bg-indigo-500/5' : ''} hover:bg-white/[0.02] transition-colors">
                        <td class="px-6 py-4 font-black flex items-center gap-3 sticky left-0 bg-zinc-950/80 backdrop-blur-md z-10 border-r border-white/5">
                            <span class="text-zinc-600 text-[10px] w-5 tabular-nums">${player.number}</span> 
                            <span class="uppercase tracking-tight">${player.name}</span>
                        </td>
                        <td class="px-6 py-4 text-center font-black text-white text-lg">${s.pts}</td>
                        <td class="px-6 py-4 text-center text-zinc-400 tabular-nums font-bold">${s.fgm}-${s.fga}</td>
                        <td class="px-6 py-4 text-center text-zinc-400 tabular-nums font-bold">${s.ftm}-${s.fta}</td>
                        <td class="px-6 py-4 text-center text-zinc-400 tabular-nums font-bold">${s.fg3m || 0}-${s.fg3a || 0}</td>
                        <td class="px-6 py-4 text-center ${fgPercent >= 50 ? 'text-emerald-400 font-black' : 'text-zinc-500'} tabular-nums">${fgPercent}%</td>
                        <td class="px-6 py-4 text-center text-white font-bold">${s.reb}</td>
                        <td class="px-6 py-4 text-center text-white font-bold">${s.ast}</td>
                        <td class="px-6 py-4 text-center ${s.foul >= 5 ? 'text-red-400 font-black' : (s.foul == 4 ? 'text-orange-400 font-bold' : 'text-zinc-400')}">${s.foul}</td>
                        <td class="px-6 py-4 text-center text-zinc-500">${s.to}</td>
                        <td class="px-6 py-4 text-center text-emerald-400 font-black tabular-nums tracking-tighter">${mins}</td>
                    </tr>
                `;
            });
            openModal('box-score-modal');
            safeLucide();
        }

        function exportCSV() {
            if (!viewingGameData) return;

            let csvContent = "Number,Name,MIN,PTS,FGM,FGA,FTM,FTA,3PM,3PA,REB,AST,FOUL,TO\n";

            viewingGameData.roster.forEach(p => {
                const mins = formatMinutes(p.stats.secondsPlayed);
                const s = p.stats;
                csvContent += `${p.number},${p.name},${mins},${s.pts},${s.fgm},${s.fga},${s.ftm},${s.fta},${s.fg3m || 0},${s.fg3a || 0},${s.reb},${s.ast},${s.foul},${s.to}\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            const gameName = viewingGameData.opponent.replace(/\s+/g, '_');
            const dateStr = viewingGameData.date.replace(/\//g, '-');
            link.setAttribute("download", `BoxScore_${viewingGameData.homeTeam}_vs_${gameName}_${dateStr}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            showToast("CSV Exported successfully", "success");
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        init();
    </script>
</body>

</html>
