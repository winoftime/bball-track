<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Hoops Tracker</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { background-color: #111827; color: white; touch-action: manipulation; user-select: none; }
        .digital-clock { font-family: 'Share Tech Mono', monospace; }
        button { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-between pb-8">

    <div class="w-full px-6 py-8 bg-gray-800 shadow-xl rounded-b-3xl">
        <div class="flex justify-between items-center mb-4">
            <div class="text-center">
                <p class="text-gray-400 text-sm font-bold tracking-widest uppercase">Home</p>
                <p id="home-score" class="text-5xl font-bold text-white">0</p>
            </div>
            <div class="text-center">
                <p class="text-gray-400 text-sm font-bold tracking-widest uppercase">Away</p>
                <p id="away-score" class="text-5xl font-bold text-white">0</p>
            </div>
        </div>
        
        <div class="flex flex-col items-center justify-center mt-6">
            <p class="text-xs text-gray-400 font-semibold mb-1 uppercase tracking-widest">Qtr 1</p>
            <div id="clock-display" onclick="toggleClock()" class="digital-clock text-6xl text-emerald-400 tracking-wider cursor-pointer active:scale-95 transition-transform">
                12:00
            </div>
            <p class="text-xs text-gray-500 mt-2">Tap clock to start/stop</p>
        </div>
    </div>

    <div class="w-full px-6 flex-grow flex flex-col justify-center">
        <div class="bg-gray-800 rounded-2xl p-4 flex items-center justify-between shadow-lg border border-gray-700">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-blue-600 flex items-center justify-center text-xl font-bold shadow-inner">
                    23
                </div>
                <div>
                    <h2 class="text-xl font-bold">LeBron J.</h2>
                    <p id="player-stats" class="text-gray-400 text-sm">Pts: 0 | Reb: 0 | Ast: 0</p>
                </div>
            </div>
            <i data-lucide="chevron-down" class="text-gray-500"></i>
        </div>
    </div>

    <div class="w-full px-6 grid grid-cols-3 gap-4">
        <button onclick="recordStat('pts', 2)" class="bg-emerald-600 active:scale-95 transition-transform rounded-2xl p-4 flex flex-col items-center justify-center shadow-lg shadow-emerald-900/50">
            <span class="text-2xl font-bold">+2</span>
            <span class="text-xs font-semibold opacity-80 mt-1 uppercase">Points</span>
        </button>
        
        <button onclick="recordStat('pts', 3)" class="bg-emerald-500 active:scale-95 transition-transform rounded-2xl p-4 flex flex-col items-center justify-center shadow-lg shadow-emerald-900/50">
            <span class="text-2xl font-bold">+3</span>
            <span class="text-xs font-semibold opacity-80 mt-1 uppercase">Points</span>
        </button>
        
        <button onclick="recordStat('reb', 1)" class="bg-blue-600 active:scale-95 transition-transform rounded-2xl p-4 flex flex-col items-center justify-center shadow-lg shadow-blue-900/50">
            <i data-lucide="hand" class="mb-1"></i>
            <span class="text-xs font-bold opacity-80 uppercase">Rebound</span>
        </button>

        <button onclick="recordStat('ast', 1)" class="bg-purple-600 active:scale-95 transition-transform rounded-2xl p-4 flex flex-col items-center justify-center shadow-lg shadow-purple-900/50">
            <i data-lucide="users" class="mb-1"></i>
            <span class="text-xs font-bold opacity-80 uppercase">Assist</span>
        </button>

        <button onclick="recordStat('foul', 1)" class="bg-red-600 active:scale-95 transition-transform rounded-2xl p-4 flex flex-col items-center justify-center shadow-lg shadow-red-900/50">
            <i data-lucide="alert-octagon" class="mb-1"></i>
            <span class="text-xs font-bold opacity-80 uppercase">Foul</span>
        </button>

        <button onclick="recordStat('to', 1)" class="bg-orange-600 active:scale-95 transition-transform rounded-2xl p-4 flex flex-col items-center justify-center shadow-lg shadow-orange-900/50">
            <i data-lucide="rotate-ccw" class="mb-1"></i>
            <span class="text-xs font-bold opacity-80 uppercase">Turnover</span>
        </button>
    </div>

    <script>
        lucide.createIcons();

        // --- GAME STATE ---
        let homeScore = 0;
        let awayScore = 0;
        
        // Player Stats (We are tracking LeBron as an example)
        let playerStats = { pts: 0, reb: 0, ast: 0, foul: 0, to: 0 };

        // Timer State (12 minutes = 720 seconds)
        let timeRemaining = 720; 
        let timerInterval = null;
        let isClockRunning = false;

        // --- THE CLOCK LOGIC ---
        function updateClockDisplay() {
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            // Pad with zero if single digit (e.g., 12:05 instead of 12:5)
            const formattedTime = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            document.getElementById('clock-display').innerText = formattedTime;
        }

        function toggleClock() {
            vibrate(); // Haptic feedback
            const clockEl = document.getElementById('clock-display');

            if (isClockRunning) {
                // Stop the clock
                clearInterval(timerInterval);
                isClockRunning = false;
                clockEl.classList.remove('text-red-500');
                clockEl.classList.add('text-emerald-400');
            } else {
                // Start the clock
                isClockRunning = true;
                clockEl.classList.remove('text-emerald-400');
                clockEl.classList.add('text-red-500'); // Turn red when running
                
                timerInterval = setInterval(() => {
                    if (timeRemaining > 0) {
                        timeRemaining--;
                        updateClockDisplay();
                    } else {
                        clearInterval(timerInterval);
                        isClockRunning = false;
                        alert("BZZZZZZ! Quarter Over!");
                    }
                }, 1000); // Run every 1000 milliseconds (1 second)
            }
        }

        // --- THE STAT LOGIC ---
        function recordStat(type, value) {
            vibrate();

            // 1. Update the player's personal stats
            if (playerStats[type] !== undefined) {
                playerStats[type] += value;
            }

            // 2. If it's points, update the team score too
            if (type === 'pts') {
                homeScore += value;
                document.getElementById('home-score').innerText = homeScore;
                
                // Add a cool animation class temporarily
                const scoreEl = document.getElementById('home-score');
                scoreEl.classList.add('text-emerald-400', 'scale-110');
                setTimeout(() => scoreEl.classList.remove('text-emerald-400', 'scale-110'), 200);
            }

            // 3. Update the Player UI
            document.getElementById('player-stats').innerText = 
                `Pts: ${playerStats.pts} | Reb: ${playerStats.reb} | Ast: ${playerStats.ast}`;
            
            // 4. Log the event to the console (View this in your browser developer tools)
            console.log(`Event Logged: +${value} ${type.toUpperCase()} at ${document.getElementById('clock-display').innerText}`);
        }

        // --- UTILITIES ---
        function vibrate() {
            if (navigator.vibrate) { navigator.vibrate(50); }
        }

        // Initialize UI on load
        updateClockDisplay();
    </script>
</body>
</html>
