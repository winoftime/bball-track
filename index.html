<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pro Hoops Tracker</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { 
            background-color: #111827; 
            color: white; 
            touch-action: manipulation; 
            user-select: none; 
            padding-bottom: env(safe-area-inset-bottom);
        }
        .digital-clock { font-family: 'Share Tech Mono', monospace; }
        button { -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
        }

        /* Toast Animation */
        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-toast { animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="h-[100dvh] flex flex-col relative overflow-hidden">

    <div id="toast-container" class="fixed top-4 left-0 right-0 z-[100] flex flex-col items-center pointer-events-none gap-2 px-4 transition-all"></div>

    <div id="view-menu" class="flex-grow flex flex-col p-6 w-full h-full overflow-y-auto">
        <div class="flex items-center justify-center py-10 flex-col">
            <div class="w-20 h-20 bg-emerald-600 rounded-full flex items-center justify-center mb-4 shadow-lg shadow-emerald-900/50">
                <i data-lucide="dribbble" class="text-white w-12 h-12"></i>
            </div>
            <h1 class="text-3xl font-bold tracking-wider uppercase text-white">Pro Hoops</h1>
            <p class="text-emerald-400 font-semibold tracking-widest text-sm">FIBA STAT TRACKER</p>
        </div>

        <button onclick="navToSetup()" class="w-full bg-blue-600 py-4 rounded-2xl font-bold text-lg active:scale-95 transition-transform mb-6 shadow-lg shadow-blue-900/50 flex items-center justify-center gap-2">
            <i data-lucide="play"></i> Start New Game
        </button>

        <h2 class="text-gray-400 text-sm font-bold tracking-widest uppercase mb-3">Game History (Tap to view stats)</h2>
        <div id="history-list" class="flex-grow space-y-3 pb-6">
            </div>
    </div>

    <div id="view-setup" class="hidden flex-grow flex flex-col p-6 w-full h-full overflow-y-auto relative">
        <button onclick="navToMenu()" class="absolute top-6 left-6 text-gray-400 hover:text-white active:scale-95">
            <i data-lucide="chevron-left" class="w-8 h-8"></i>
        </button>
        <h2 class="text-2xl font-bold mb-6 text-center mt-2">Game Setup</h2>

        <div class="space-y-4 mb-6">
            <div class="flex gap-4">
                <div class="flex-1">
                    <label class="text-xs text-gray-400 font-semibold uppercase tracking-widest px-1">Your Team</label>
                    <input type="text" id="setup-home" placeholder="e.g. Lakers" class="w-full bg-gray-800 text-white rounded-xl p-3 border border-gray-700 focus:outline-none focus:border-emerald-500 mt-1">
                </div>
                <div class="flex-1">
                    <label class="text-xs text-gray-400 font-semibold uppercase tracking-widest px-1">Opponent</label>
                    <input type="text" id="setup-opponent" placeholder="e.g. Bulls" class="w-full bg-gray-800 text-white rounded-xl p-3 border border-gray-700 focus:outline-none focus:border-emerald-500 mt-1">
                </div>
            </div>
            <div>
                <label class="text-xs text-gray-400 font-semibold uppercase tracking-widest px-1">Date</label>
                <input type="date" id="setup-date" class="w-full bg-gray-800 text-white rounded-xl p-3 border border-gray-700 focus:outline-none focus:border-emerald-500 mt-1">
            </div>
        </div>

        <div class="flex justify-between items-end mb-3">
            <label class="text-xs text-gray-400 font-semibold uppercase tracking-widest px-1">Select Starting 5</label>
            <button onclick="openModal('add-player-modal')" class="text-xs text-emerald-400 font-bold bg-emerald-900/30 px-3 py-1 rounded-full active:scale-95">+ Add Player</button>
        </div>
        
        <div id="setup-roster-list" class="flex-grow space-y-2 mb-6 overflow-y-auto">
            </div>

        <button onclick="startGame()" class="w-full bg-emerald-600 py-4 rounded-2xl font-bold text-lg active:scale-95 transition-transform shadow-lg shadow-emerald-900/50 shrink-0 mb-4">
            Tip Off
        </button>
    </div>

    <div id="view-game" class="hidden h-[100dvh] flex flex-col justify-between relative overflow-hidden">
        
        <div class="w-full px-4 py-5 bg-gray-800 shadow-xl rounded-b-3xl shrink-0 z-10">
            <div class="flex justify-between items-center mb-1">
                <button onclick="confirmExitGame()" class="text-gray-500 active:scale-95 p-1"><i data-lucide="chevron-left"></i></button>
                <div class="flex flex-col items-center justify-center cursor-pointer active:scale-95" onclick="advancePeriod()">
                    <p id="period-display" class="text-xs text-emerald-400 font-bold mb-1 uppercase tracking-widest px-2 py-0.5 bg-emerald-900/30 rounded-full">Qtr 1</p>
                </div>
                <div class="w-6"></div> 
            </div>

            <div class="flex justify-between items-center">
                <div class="text-center flex-1 flex flex-col items-center relative">
                    <p id="home-name-display" class="text-gray-400 text-xs font-bold tracking-widest uppercase truncate w-full max-w-[80px]">Home</p>
                    <p id="home-score" class="text-5xl font-bold text-white transition-all">0</p>
                </div>
                <div class="flex flex-col items-center justify-center flex-1">
                    <div id="clock-display" onclick="toggleClock()" class="digital-clock text-4xl text-emerald-400 tracking-wider cursor-pointer active:scale-95 transition-transform">
                        10:00
                    </div>
                </div>
                <div class="text-center flex-1 flex flex-col items-center relative">
                    <p id="away-name-display" class="text-gray-400 text-xs font-bold tracking-widest uppercase truncate w-full max-w-[80px]">Away</p>
                    <p id="away-score" class="text-5xl font-bold text-gray-300">0</p>
                    <div class="flex gap-2 mt-1 absolute -bottom-5">
                        <button onclick="changeAwayScore(-1)" class="w-6 h-6 bg-gray-700 rounded-full flex items-center justify-center text-xs font-bold active:scale-95">-</button>
                        <button onclick="changeAwayScore(1)" class="w-6 h-6 bg-gray-700 rounded-full flex items-center justify-center text-xs font-bold active:scale-95">+</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="w-full px-4 mt-6 shrink-0">
            <p class="text-xs text-gray-400 font-semibold mb-0 uppercase tracking-widest px-2">On Court</p>
            <div id="active-players-container" class="flex gap-4 overflow-x-auto no-scrollbar pt-3 pb-3 px-2">
                </div>
        </div>

        <div class="w-full px-4 flex-grow content-center mt-2">
            <div class="stat-grid">
                <button onclick="recordStat('ft_made')" class="bg-emerald-600 active:scale-95 rounded-2xl p-3 flex flex-col items-center justify-center shadow-lg">
                    <span class="text-xl font-bold">+1</span>
                    <span class="text-[10px] font-semibold opacity-80 mt-1 uppercase">Free Throw</span>
                </button>
                <button onclick="recordStat('fg2_made')" class="bg-emerald-500 active:scale-95 rounded-2xl p-3 flex flex-col items-center justify-center shadow-lg">
                    <span class="text-xl font-bold">+2</span>
                    <span class="text-[10px] font-semibold opacity-80 mt-1 uppercase">Points</span>
                </button>
                <button onclick="recordStat('fg3_made')" class="bg-emerald-400 text-gray-900 active:scale-95 rounded-2xl p-3 flex flex-col items-center justify-center shadow-lg">
                    <span class="text-xl font-bold">+3</span>
                    <span class="text-[10px] font-semibold opacity-80 mt-1 uppercase">Points</span>
                </button>
                
                <button onclick="recordStat('ft_miss')" class="bg-red-900/60 text-red-300 border border-red-800 active:scale-95 rounded-2xl p-3 flex flex-col items-center justify-center">
                    <i data-lucide="x" class="w-5 h-5 mb-1"></i>
                    <span class="text-[10px] font-semibold uppercase">Miss FT</span>
                </button>
                <button onclick="recordStat('fg2_miss')" class="bg-red-900/60 text-red-300 border border-red-800 active:scale-95 rounded-2xl p-3 flex flex-col items-center justify-center">
                    <i data-lucide="x" class="w-5 h-5 mb-1"></i>
                    <span class="text-[10px] font-semibold uppercase">Miss 2PT</span>
                </button>
                <button onclick="recordStat('fg3_miss')" class="bg-red-900/60 text-red-300 border border-red-800 active:scale-95 rounded-2xl p-3 flex flex-col items-center justify-center">
                    <i data-lucide="x" class="w-5 h-5 mb-1"></i>
                    <span class="text-[10px] font-semibold uppercase">Miss 3PT</span>
                </button>

                <button onclick="recordStat('reb')" class="bg-blue-600 active:scale-95 rounded-2xl p-3 flex flex-col items-center justify-center shadow-lg">
                    <i data-lucide="hand" class="mb-1 w-5 h-5"></i>
                    <span class="text-[10px] font-bold uppercase">Rebound</span>
                </button>
                <button onclick="recordStat('ast')" class="bg-purple-600 active:scale-95 rounded-2xl p-3 flex flex-col items-center justify-center shadow-lg">
                    <i data-lucide="users" class="mb-1 w-5 h-5"></i>
                    <span class="text-[10px] font-bold uppercase">Assist</span>
                </button>
                <button onclick="recordStat('foul')" class="bg-orange-600 active:scale-95 rounded-2xl p-3 flex flex-col items-center justify-center shadow-lg">
                    <i data-lucide="alert-octagon" class="mb-1 w-5 h-5"></i>
                    <span class="text-[10px] font-bold uppercase">Foul</span>
                </button>
                <button onclick="recordStat('to')" class="bg-gray-700 active:scale-95 rounded-2xl p-3 flex flex-col items-center justify-center shadow-lg col-start-2">
                    <i data-lucide="rotate-ccw" class="mb-1 w-5 h-5"></i>
                    <span class="text-[10px] font-bold uppercase">Turnover</span>
                </button>
            </div>
        </div>

        <div class="w-full px-4 shrink-0 mb-4 mt-2">
            <div class="bg-gray-800 rounded-2xl p-2 flex justify-around shadow-lg border border-gray-700">
                <button onclick="openSubsModal()" class="flex flex-col items-center p-2 text-gray-400 hover:text-white active:scale-95">
                    <i data-lucide="arrow-right-left" class="mb-1 w-5 h-5"></i>
                    <span class="text-[10px] uppercase font-bold tracking-wider">Subs</span>
                </button>
                <button onclick="undoLastAction()" class="flex flex-col items-center p-2 text-gray-400 hover:text-white active:scale-95">
                    <i data-lucide="undo-2" class="mb-1 w-5 h-5"></i>
                    <span class="text-[10px] uppercase font-bold tracking-wider">Undo</span>
                </button>
                <button onclick="openBoxScoreModal()" class="flex flex-col items-center p-2 text-gray-400 hover:text-white active:scale-95">
                    <i data-lucide="clipboard-list" class="mb-1 w-5 h-5"></i>
                    <span class="text-[10px] uppercase font-bold tracking-wider">Stats</span>
                </button>
                <button onclick="confirmEndGame()" class="flex flex-col items-center p-2 text-red-400 hover:text-red-300 active:scale-95">
                    <i data-lucide="check-square" class="mb-1 w-5 h-5"></i>
                    <span class="text-[10px] uppercase font-bold tracking-wider">End</span>
                </button>
            </div>
        </div>
    </div>

    <div id="confirm-modal" class="hidden fixed inset-0 bg-black/95 z-[100] flex items-center justify-center p-6 transition-opacity">
        <div class="bg-gray-800 w-full max-w-sm rounded-3xl p-6 border border-gray-700 text-center shadow-2xl">
            <h2 id="confirm-title" class="text-xl font-bold mb-2">Are you sure?</h2>
            <p id="confirm-message" class="text-gray-400 text-sm mb-6">This action cannot be undone.</p>
            <div class="flex gap-3">
                <button id="btn-confirm-cancel" class="flex-1 bg-gray-700 py-3 rounded-xl font-bold active:scale-95 transition-transform">Cancel</button>
                <button id="btn-confirm-action" class="flex-1 bg-blue-600 py-3 rounded-xl font-bold active:scale-95 transition-transform">Confirm</button>
            </div>
        </div>
    </div>

    <div id="add-player-modal" class="hidden fixed inset-0 bg-black/95 z-50 flex items-center justify-center p-6">
        <div class="bg-gray-800 w-full max-w-sm rounded-3xl p-6 border border-gray-700">
            <h2 id="player-modal-title" class="text-xl font-bold mb-4">Add Player</h2>
            <input type="hidden" id="edit-player-id">
            <input type="text" id="new-player-name" placeholder="Player Name" class="w-full bg-gray-900 text-white rounded-xl p-3 mb-3 border border-gray-600 focus:outline-none focus:border-emerald-500">
            <input type="number" id="new-player-number" placeholder="Jersey Number" class="w-full bg-gray-900 text-white rounded-xl p-3 mb-6 border border-gray-600 focus:outline-none focus:border-emerald-500">
            
            <div class="flex justify-between items-center mb-4 hidden" id="delete-player-container">
                <button onclick="confirmDeletePlayer()" class="text-red-500 text-sm font-bold active:scale-95 flex items-center gap-1"><i data-lucide="trash-2" class="w-4 h-4"></i> Delete Player</button>
            </div>

            <div class="flex gap-3">
                <button onclick="closeModal('add-player-modal')" class="flex-1 bg-gray-700 py-3 rounded-xl font-bold active:scale-95 transition-transform">Cancel</button>
                <button onclick="savePlayer()" class="flex-1 bg-emerald-600 py-3 rounded-xl font-bold active:scale-95 transition-transform">Save</button>
            </div>
        </div>
    </div>

    <div id="subs-modal" class="hidden fixed inset-0 bg-black/95 z-50 flex flex-col p-6">
        <div class="flex justify-between items-center mb-6 mt-4">
            <h2 class="text-2xl font-bold">Manage Lineup</h2>
            <button onclick="closeModal('subs-modal')" class="bg-gray-800 p-2 rounded-full active:scale-95"><i data-lucide="x"></i></button>
        </div>
        <p class="text-sm text-gray-400 mb-4">Select 5 players to be on the court.</p>
        <div id="roster-list" class="flex-grow overflow-y-auto space-y-3 pb-8 no-scrollbar">
            </div>
    </div>

    <div id="box-score-modal" class="hidden fixed inset-0 bg-black/95 z-50 flex flex-col p-6">
        <div class="flex justify-between items-center mb-6 mt-4">
            <h2 id="box-score-title" class="text-2xl font-bold">Box Score</h2>
            <button onclick="closeModal('box-score-modal')" class="bg-gray-800 p-2 rounded-full active:scale-95"><i data-lucide="x"></i></button>
        </div>
        <div class="overflow-x-auto flex-grow bg-gray-900 rounded-xl border border-gray-700 no-scrollbar relative">
            <table class="w-full text-left text-sm whitespace-nowrap">
                <thead class="bg-gray-800 text-gray-400 text-xs uppercase tracking-wider sticky top-0">
                    <tr>
                        <th class="px-4 py-3 sticky left-0 bg-gray-800 z-10">Player</th>
                        <th class="px-4 py-3">PTS</th>
                        <th class="px-4 py-3">FGM-A</th>
                        <th class="px-4 py-3">FTM-A</th>
                        <th class="px-4 py-3">REB</th>
                        <th class="px-4 py-3">AST</th>
                        <th class="px-4 py-3">FLS</th>
                        <th class="px-4 py-3">TO</th>
                        <th class="px-4 py-3">MIN</th>
                    </tr>
                </thead>
                <tbody id="box-score-body" class="divide-y divide-gray-800">
                    </tbody>
            </table>
        </div>
        <button onclick="exportCSV()" class="mt-4 w-full bg-emerald-600 py-4 rounded-xl font-bold active:scale-95 transition-transform flex items-center justify-center gap-2 shrink-0">
            <i data-lucide="download"></i> Download CSV
        </button>
    </div>

    <script>
        lucide.createIcons();

        // --- GLOBAL STATE & STORAGE ---
        let appState = {
            masterRoster: [], 
            history: [],
            activeGame: null 
        };

        const SECONDS_PER_PERIOD = 600; // FIBA: 10 mins
        let timerInterval = null;
        let isClockRunning = false;
        let currentActivePlayerId = null;
        let viewingGameData = null; // Used for the box score modal

        // --- CUSTOM UI COMPONENTS ---
        function showToast(message, type = 'info') {
            vibrate();
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgClass = 'bg-gray-800 border-gray-700 text-white';
            let icon = '<i data-lucide="info" class="w-5 h-5 text-blue-400"></i>';
            
            if (type === 'warning') {
                bgClass = 'bg-orange-900 border-orange-700 text-white';
                icon = '<i data-lucide="alert-triangle" class="w-5 h-5 text-orange-400"></i>';
            } else if (type === 'error') {
                bgClass = 'bg-red-900 border-red-700 text-white';
                icon = '<i data-lucide="alert-octagon" class="w-5 h-5 text-red-400"></i>';
            } else if (type === 'success') {
                bgClass = 'bg-emerald-900 border-emerald-700 text-white';
                icon = '<i data-lucide="check-circle" class="w-5 h-5 text-emerald-400"></i>';
            }

            toast.className = `flex items-center gap-3 px-4 py-3 rounded-2xl shadow-2xl border ${bgClass} animate-toast pointer-events-auto max-w-sm w-full`;
            toast.innerHTML = `
                ${icon}
                <p class="text-sm font-semibold flex-grow">${message}</p>
                <button onclick="this.parentElement.remove()" class="text-gray-400 hover:text-white p-1"><i data-lucide="x" class="w-4 h-4"></i></button>
            `;
            
            container.appendChild(toast);
            lucide.createIcons({ root: toast });

            setTimeout(() => { if(toast.parentElement) toast.remove(); }, 3500);
        }

        function showConfirm(title, message, confirmText, confirmClass, onConfirm) {
            vibrate();
            const modal = document.getElementById('confirm-modal');
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-message').innerText = message;
            
            const actionBtn = document.getElementById('btn-confirm-action');
            actionBtn.innerText = confirmText;
            actionBtn.className = `flex-1 py-3 rounded-xl font-bold active:scale-95 transition-transform ${confirmClass}`;
            
            const cancelBtn = document.getElementById('btn-confirm-cancel');
            
            const newActionBtn = actionBtn.cloneNode(true);
            actionBtn.parentNode.replaceChild(newActionBtn, actionBtn);
            
            const newCancelBtn = cancelBtn.cloneNode(true);
            cancelBtn.parentNode.replaceChild(newCancelBtn, cancelBtn);
            
            newActionBtn.addEventListener('click', () => {
                modal.classList.add('hidden');
                onConfirm();
            });
            
            newCancelBtn.addEventListener('click', () => {
                modal.classList.add('hidden');
            });
            
            modal.classList.remove('hidden');
        }

        // --- INIT & PERSISTENCE ---
        function loadState() {
            const saved = localStorage.getItem('proHoopsState');
            if (saved) appState = JSON.parse(saved);
        }

        function saveState() {
            localStorage.setItem('proHoopsState', JSON.stringify(appState));
        }

        function init() {
            loadState();
            document.getElementById('setup-date').valueAsDate = new Date();
            if (appState.activeGame) {
                renderGameScreen();
                showView('view-game');
            } else {
                renderMenu();
                showView('view-menu');
            }
        }

        // --- NAVIGATION ---
        function showView(viewId) {
            ['view-menu', 'view-setup', 'view-game'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');
        }

        function navToMenu() {
            renderMenu();
            showView('view-menu');
        }

        function navToSetup() {
            document.getElementById('setup-home').value = '';
            document.getElementById('setup-opponent').value = '';
            appState.masterRoster.forEach(p => p.selectedForGame = false);
            renderSetupRoster();
            showView('view-setup');
        }

        // --- MENU LOGIC ---
        function renderMenu() {
            const list = document.getElementById('history-list');
            list.innerHTML = '';
            
            if (appState.history.length === 0) {
                list.innerHTML = `<p class="text-sm text-gray-500 py-4 italic text-center">No games saved yet.</p>`;
                return;
            }

            const sortedHistory = [...appState.history].reverse();
            sortedHistory.forEach(game => {
                const isWin = game.homeScore > game.awayScore;
                const resultColor = isWin ? 'text-emerald-400' : 'text-red-400';
                const resultText = isWin ? 'W' : 'L';

                list.innerHTML += `
                    <div onclick="openBoxScoreModal(${game.id})" class="bg-gray-800 rounded-xl p-4 flex justify-between items-center border border-gray-700 cursor-pointer active:scale-95 transition-transform shadow-lg">
                        <div>
                            <p class="text-xs text-gray-400">${game.date}</p>
                            <p class="font-bold text-lg">${game.homeTeam} vs ${game.opponent}</p>
                        </div>
                        <div class="text-right flex items-center gap-3">
                            <span class="${resultColor} font-bold text-xl">${resultText}</span>
                            <span class="text-xl font-bold">${game.homeScore} - ${game.awayScore}</span>
                        </div>
                    </div>
                `;
            });
        }

        // --- ROSTER/SETUP LOGIC ---
        function renderSetupRoster() {
            const list = document.getElementById('setup-roster-list');
            list.innerHTML = '';
            
            if (appState.masterRoster.length === 0) {
                list.innerHTML = `<p class="text-sm text-gray-500 py-4 italic text-center">Add players to build your team.</p>`;
                return;
            }

            appState.masterRoster.forEach(p => {
                const isSelected = p.selectedForGame;
                list.innerHTML += `
                    <div class="bg-gray-800 rounded-xl p-3 flex items-center justify-between border border-gray-700">
                        <div class="flex items-center gap-3 cursor-pointer" onclick="toggleSetupSelection(${p.id})">
                            <div class="w-6 h-6 rounded border ${isSelected ? 'bg-emerald-500 border-emerald-500' : 'border-gray-500'} flex items-center justify-center transition-colors">
                                ${isSelected ? '<i data-lucide="check" class="w-4 h-4 text-white"></i>' : ''}
                            </div>
                            <div class="w-8 h-8 rounded-full bg-gray-700 flex items-center justify-center font-bold text-sm">
                                ${p.number}
                            </div>
                            <span class="font-bold">${p.name}</span>
                        </div>
                        <button onclick="editPlayer(${p.id})" class="p-2 text-gray-400 hover:text-white"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                    </div>
                `;
            });
            lucide.createIcons();
        }

        function toggleSetupSelection(id) {
            const player = appState.masterRoster.find(p => p.id === id);
            const selectedCount = appState.masterRoster.filter(p => p.selectedForGame).length;
            
            if (!player.selectedForGame && selectedCount >= 5) {
                return showToast("You can only select 5 starting players.", "warning");
            }
            player.selectedForGame = !player.selectedForGame;
            renderSetupRoster();
            saveState();
        }

        function editPlayer(id) {
            const player = appState.masterRoster.find(p => p.id === id);
            document.getElementById('player-modal-title').innerText = "Edit Player";
            document.getElementById('edit-player-id').value = player.id;
            document.getElementById('new-player-name').value = player.name;
            document.getElementById('new-player-number').value = player.number;
            document.getElementById('delete-player-container').classList.remove('hidden');
            openModal('add-player-modal');
        }

        function savePlayer() {
            const nameInput = document.getElementById('new-player-name').value;
            const numberInput = document.getElementById('new-player-number').value;
            const editId = document.getElementById('edit-player-id').value;
            
            if (!nameInput || !numberInput) return showToast("Please enter a name and number.", "warning");

            if (editId) {
                const player = appState.masterRoster.find(p => p.id == editId);
                player.name = nameInput;
                player.number = numberInput;
            } else {
                appState.masterRoster.push({
                    id: Date.now(), 
                    number: numberInput,
                    name: nameInput,
                    selectedForGame: false
                });
            }

            resetPlayerModal();
            closeModal('add-player-modal');
            renderSetupRoster();
            saveState();
        }

        function confirmDeletePlayer() {
            showConfirm(
                "Delete Player", 
                "Are you sure you want to remove this player from your roster?", 
                "Delete", 
                "bg-red-600", 
                () => {
                    const editId = document.getElementById('edit-player-id').value;
                    appState.masterRoster = appState.masterRoster.filter(p => p.id != editId);
                    resetPlayerModal();
                    closeModal('add-player-modal');
                    renderSetupRoster();
                    saveState();
                    showToast("Player deleted.", "info");
                }
            );
        }

        function resetPlayerModal() {
            document.getElementById('player-modal-title').innerText = "Add Player";
            document.getElementById('edit-player-id').value = '';
            document.getElementById('new-player-name').value = '';
            document.getElementById('new-player-number').value = '';
            document.getElementById('delete-player-container').classList.add('hidden');
        }

        // --- GAME LOGIC ---
        function startGame() {
            const homeTeam = document.getElementById('setup-home').value || "Home";
            const opponent = document.getElementById('setup-opponent').value || "Away";
            const date = document.getElementById('setup-date').value;
            const selectedPlayers = appState.masterRoster.filter(p => p.selectedForGame);

            if(selectedPlayers.length === 0) {
                return showToast("Please select at least 1 player to start the game.", "warning");
            }

            const gameRoster = appState.masterRoster.map(p => ({
                id: p.id,
                name: p.name,
                number: p.number,
                onCourt: p.selectedForGame,
                stats: { pts: 0, fgm: 0, fga: 0, ftm: 0, fta: 0, reb: 0, ast: 0, foul: 0, to: 0, secondsPlayed: 0 }
            }));

            appState.activeGame = {
                id: Date.now(),
                homeTeam: homeTeam,
                opponent: opponent,
                date: date,
                period: 1,
                timeRemaining: SECONDS_PER_PERIOD,
                homeScore: 0,
                awayScore: 0,
                roster: gameRoster,
                actionHistory: []
            };

            currentActivePlayerId = gameRoster.find(p => p.onCourt).id;
            
            saveState();
            renderGameScreen();
            showView('view-game');
        }

        function renderGameScreen() {
            const game = appState.activeGame;
            document.getElementById('home-name-display').innerText = game.homeTeam;
            document.getElementById('away-name-display').innerText = game.opponent;
            document.getElementById('home-score').innerText = game.homeScore;
            document.getElementById('away-score').innerText = game.awayScore;
            
            let pText = game.period <= 4 ? `Qtr ${game.period}` : `OT ${game.period - 4}`;
            document.getElementById('period-display').innerText = pText;

            updateClockDisplay();
            renderActivePlayers();
        }

        // --- CLOCK & PERIOD LOGIC ---
        function updateClockDisplay() {
            const game = appState.activeGame;
            const minutes = Math.floor(game.timeRemaining / 60);
            const seconds = game.timeRemaining % 60;
            document.getElementById('clock-display').innerText = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function toggleClock() {
            vibrate();
            const clockEl = document.getElementById('clock-display');
            
            if (isClockRunning) {
                clearInterval(timerInterval);
                isClockRunning = false;
                clockEl.classList.remove('text-red-500');
                clockEl.classList.add('text-emerald-400');
            } else {
                isClockRunning = true;
                clockEl.classList.remove('text-emerald-400');
                clockEl.classList.add('text-red-500');
                
                timerInterval = setInterval(() => {
                    if (appState.activeGame.timeRemaining > 0) {
                        appState.activeGame.timeRemaining--;
                        appState.activeGame.roster.forEach(p => {
                            if (p.onCourt) p.stats.secondsPlayed++;
                        });
                        updateClockDisplay();
                        if (appState.activeGame.timeRemaining % 5 === 0) saveState();
                    } else {
                        clearInterval(timerInterval);
                        isClockRunning = false;
                        clockEl.classList.remove('text-red-500');
                        clockEl.classList.add('text-emerald-400');
                        showToast("BZZZZZZ! Period Over!", "info");
                    }
                }, 1000);
            }
        }

        function advancePeriod() {
            showConfirm(
                "Advance Period", 
                "Start the next period? The game clock will reset.", 
                "Next Period", 
                "bg-emerald-600", 
                () => {
                    if(isClockRunning) toggleClock();
                    appState.activeGame.period++;
                    appState.activeGame.timeRemaining = SECONDS_PER_PERIOD;
                    renderGameScreen();
                    saveState();
                }
            );
        }

        // --- OPPONENT SCORE ---
        function changeAwayScore(amount) {
            vibrate();
            appState.activeGame.awayScore = Math.max(0, appState.activeGame.awayScore + amount);
            document.getElementById('away-score').innerText = appState.activeGame.awayScore;
            saveState();
        }

        // --- ON-COURT LOGIC ---
        function renderActivePlayers() {
            const container = document.getElementById('active-players-container');
            container.innerHTML = '';
            
            const onCourtPlayers = appState.activeGame.roster.filter(p => p.onCourt);
            
            if (!onCourtPlayers.find(p => p.id === currentActivePlayerId) && onCourtPlayers.length > 0) {
                currentActivePlayerId = onCourtPlayers[0].id;
            }

            onCourtPlayers.forEach(player => {
                const isActive = player.id === currentActivePlayerId;
                
                let activeClasses = isActive ? "bg-blue-600 ring-2 ring-offset-2 ring-offset-gray-900 ring-white scale-105" : "bg-gray-700 opacity-70";
                
                // FIBA Foul Trouble logic (4 = trouble, 5 = out)
                if (player.stats.foul === 4) {
                    activeClasses = "bg-orange-600 ring-4 ring-orange-500 ring-offset-2 ring-offset-gray-900 scale-105";
                } else if (player.stats.foul >= 5) {
                    activeClasses = "bg-red-600 ring-4 ring-red-500 ring-offset-2 ring-offset-gray-900 scale-105";
                }

                container.innerHTML += `
                    <div onclick="setActivePlayer(${player.id})" class="flex flex-col items-center cursor-pointer transition-all min-w-[70px]">
                        <div class="w-14 h-14 rounded-full flex items-center justify-center text-xl font-bold shadow-lg ${activeClasses} transition-all">
                            ${player.number}
                        </div>
                        <p class="text-xs mt-2 font-semibold truncate w-full text-center ${isActive ? 'text-white' : 'text-gray-400'}">${player.name.split(' ')[0]}</p>
                        <p class="text-[10px] text-emerald-400 font-semibold">${player.stats.pts}P ${player.stats.reb}R ${player.stats.foul}F</p>
                    </div>
                `;
            });

            if (onCourtPlayers.length === 0) {
                container.innerHTML = `<p class="text-sm text-gray-500 py-4 italic">No players on court. Open Subs.</p>`;
            }
        }

        function setActivePlayer(id) {
            vibrate();
            currentActivePlayerId = id;
            renderActivePlayers();
        }

        function openSubsModal() {
            const list = document.getElementById('roster-list');
            list.innerHTML = '';
            
            appState.activeGame.roster.forEach(player => {
                const btnClass = player.onCourt ? "bg-red-900/50 text-red-400 border-red-700" : "bg-emerald-900/50 text-emerald-400 border-emerald-700";
                const btnText = player.onCourt ? "Sub Out" : "Sub In";

                list.innerHTML += `
                    <div class="bg-gray-800 rounded-xl p-4 flex items-center justify-between border border-gray-700">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-full bg-gray-700 flex items-center justify-center font-bold">
                                ${player.number}
                            </div>
                            <div>
                                <h3 class="font-bold">${player.name}</h3>
                                <p class="text-xs text-gray-400">${player.stats.pts} PTS | ${player.stats.foul} FLS</p>
                            </div>
                        </div>
                        <button onclick="toggleSub(${player.id})" class="px-4 py-2 border rounded-lg text-sm font-bold active:scale-95 ${btnClass}">
                            ${btnText}
                        </button>
                    </div>
                `;
            });
            openModal('subs-modal');
        }

        function toggleSub(id) {
            const player = appState.activeGame.roster.find(p => p.id === id);
            const onCourtCount = appState.activeGame.roster.filter(p => p.onCourt).length;

            if (!player.onCourt && onCourtCount >= 5) {
                return showToast("You already have 5 players on the court. Sub someone out first.", "warning");
            }

            player.onCourt = !player.onCourt;
            openSubsModal(); 
            renderActivePlayers();
            saveState();
        }

        // --- STAT RECORDING & UNDO ---
        function recordStat(actionType) {
            const player = appState.activeGame.roster.find(p => p.id === currentActivePlayerId);
            if (!player) return showToast("Select a player on the court first.", "warning");

            vibrate();
            let statChanges = {};
            
            switch(actionType) {
                case 'ft_made': statChanges = { pts: 1, ftm: 1, fta: 1 }; break;
                case 'ft_miss': statChanges = { fta: 1 }; break;
                case 'fg2_made': statChanges = { pts: 2, fgm: 1, fga: 1 }; break;
                case 'fg2_miss': statChanges = { fga: 1 }; break;
                case 'fg3_made': statChanges = { pts: 3, fgm: 1, fga: 1 }; break;
                case 'fg3_miss': statChanges = { fga: 1 }; break;
                case 'reb': statChanges = { reb: 1 }; break;
                case 'ast': statChanges = { ast: 1 }; break;
                case 'foul': statChanges = { foul: 1 }; break;
                case 'to': statChanges = { to: 1 }; break;
            }

            for (const [key, val] of Object.entries(statChanges)) {
                player.stats[key] += val;
            }

            appState.activeGame.actionHistory.push({ 
                playerId: player.id, 
                changes: statChanges 
            });

            if (statChanges.pts) {
                appState.activeGame.homeScore += statChanges.pts;
                const scoreEl = document.getElementById('home-score');
                scoreEl.innerText = appState.activeGame.homeScore;
                scoreEl.classList.add('text-emerald-400', 'scale-110');
                setTimeout(() => scoreEl.classList.remove('text-emerald-400', 'scale-110'), 200);
            }

            if (statChanges.foul) {
                if (player.stats.foul >= 5) showToast(`🛑 FOULED OUT: ${player.name} has reached 5 fouls!`, "error");
                else if (player.stats.foul === 4) showToast(`⚠️ FOUL TROUBLE: ${player.name} has 4 fouls.`, "warning");
            }

            renderActivePlayers();
            saveState();
        }

        function undoLastAction() {
            const history = appState.activeGame.actionHistory;
            if (history.length === 0) return showToast("Nothing to undo!", "info");

            vibrate();
            const lastAction = history.pop();
            const player = appState.activeGame.roster.find(p => p.id === lastAction.playerId);

            if (player) {
                for (const [key, val] of Object.entries(lastAction.changes)) {
                    player.stats[key] -= val;
                }
                if (lastAction.changes.pts) {
                    appState.activeGame.homeScore -= lastAction.changes.pts;
                    document.getElementById('home-score').innerText = appState.activeGame.homeScore;
                }
            }

            renderActivePlayers();
            saveState();
            showToast("Action undone.", "success");
        }

        // --- GAME END & UTILS ---
        function confirmExitGame() {
            showConfirm(
                "Exit Game", 
                "Exit to main menu? Your game will remain active in the background.", 
                "Exit to Menu", 
                "bg-gray-600", 
                () => {
                    if(isClockRunning) toggleClock();
                    navToMenu();
                }
            );
        }

        function confirmEndGame() {
            showConfirm(
                "End Game", 
                "Are you sure you want to END this game? It will be saved to your history forever.", 
                "End Game", 
                "bg-red-600", 
                () => {
                    if(isClockRunning) toggleClock();
                    appState.history.push(appState.activeGame);
                    appState.activeGame = null;
                    saveState();
                    navToMenu();
                    showToast("Game saved to history.", "success");
                }
            );
        }

        function formatMinutes(totalSeconds) {
            const m = Math.floor(totalSeconds / 60);
            const s = totalSeconds % 60;
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function openBoxScoreModal(gameId = null) {
            if (gameId) {
                viewingGameData = appState.history.find(g => g.id === gameId);
            } else {
                viewingGameData = appState.activeGame;
            }

            if (!viewingGameData) return showToast("No game data found.", "error");

            document.getElementById('box-score-title').innerText = `${viewingGameData.homeTeam} vs ${viewingGameData.opponent}`;

            const tbody = document.getElementById('box-score-body');
            tbody.innerHTML = '';
            
            viewingGameData.roster.forEach(player => {
                const mins = formatMinutes(player.stats.secondsPlayed);
                tbody.innerHTML += `
                    <tr>
                        <td class="px-4 py-3 font-bold flex items-center gap-2 sticky left-0 bg-gray-900 z-10">
                            <span class="text-gray-500 text-xs w-4">${player.number}</span> ${player.name}
                        </td>
                        <td class="px-4 py-3 font-bold text-white">${player.stats.pts}</td>
                        <td class="px-4 py-3">${player.stats.fgm}-${player.stats.fga}</td>
                        <td class="px-4 py-3">${player.stats.ftm}-${player.stats.fta}</td>
                        <td class="px-4 py-3">${player.stats.reb}</td>
                        <td class="px-4 py-3">${player.stats.ast}</td>
                        <td class="px-4 py-3 ${player.stats.foul >= 5 ? 'text-red-400 font-bold' : (player.stats.foul == 4 ? 'text-orange-400 font-bold' : '')}">${player.stats.foul}</td>
                        <td class="px-4 py-3">${player.stats.to}</td>
                        <td class="px-4 py-3 text-emerald-400">${mins}</td>
                    </tr>
                `;
            });
            openModal('box-score-modal');
        }

        function exportCSV() {
            if (!viewingGameData) return;

            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "Number,Name,MIN,PTS,FGM,FGA,FTM,FTA,REB,AST,FOUL,TO\n";
            
            viewingGameData.roster.forEach(p => {
                const mins = formatMinutes(p.stats.secondsPlayed);
                const s = p.stats;
                csvContent += `${p.number},${p.name},${mins},${s.pts},${s.fgm},${s.fga},${s.ftm},${s.fta},${s.reb},${s.ast},${s.foul},${s.to}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            const gameName = viewingGameData.opponent.replace(/\s+/g, '_');
            link.setAttribute("download", `BoxScore_${viewingGameData.homeTeam}_vs_${gameName}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link); 
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function vibrate() { if (navigator.vibrate) navigator.vibrate(50); }

        init();
    </script>
</body>
</html>
